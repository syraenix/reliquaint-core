# Schema validation for the Reliquaint Core tap: installs the launcher and runs
# `reliquaint tap validate .` (the `tap validate` subcommand shipped in launcher v0.3).

name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Reliquaint
        run: |
          set -euo pipefail
          # Refresh the apt index first: the runner's preinstalled index can be stale,
          # causing 404s when `apt-get -f install` fetches the launcher's GTK/GStreamer deps.
          sudo apt-get update
          # Preferred: install the latest released .deb from the launcher repo.
          url="$(curl -fsSL https://api.github.com/repos/syraenix/reliquaint/releases/latest \
            | grep -oE 'https://[^"]+\.deb' | head -n1)"
          if [ -n "${url:-}" ]; then
            curl -fsSL -o reliquaint.deb "$url"
            sudo dpkg -i reliquaint.deb || sudo apt-get -f install -y
          else
            # Fallback: build from source (slower).
            cargo install --git https://github.com/syraenix/reliquaint reliquaint
          fi
          reliquaint --version

      - name: Validate tap
        run: reliquaint tap validate .
